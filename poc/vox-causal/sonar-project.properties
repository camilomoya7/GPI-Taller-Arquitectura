# Configuración para SonarCloud (opcional). Crear el proyecto en sonarcloud.io e ingresar
# SONAR_TOKEN como secreto del repositorio; completar organization y projectKey.
sonar.organization=REEMPLAZAR_ORGANIZACION
sonar.projectKey=REEMPLAZAR_ORGANIZACION_vox-causal-poc
